---
- name: Create directory using Ansible
  hosts: linux_servers
  gather_facts: false

  tasks:
    - name: Ensure directory exists
      ansible.builtin.file:
        path: /tmp/ansible_lab
        state: directory
        mode: '0755'

 - name: Second attempt to create same directory
      ansible.builtin.file:
        path: /tmp/ansible_lab
        state: directory
        mode: '0755'
