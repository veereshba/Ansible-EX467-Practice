---
- name: Test Ansible Idempotency
  hosts: linux_servers
  gather_facts: false

  tasks:
    - name: First attempt to create directory
      ansible.builtin.file:
        path: /tmp/ansible_lab
        state: directory
        mode: '0755'

    - name: Second attempt to create same directory
      ansible.builtin.file:
        path: /tmp/ansible_lab
        state: directory
        mode: '0755'
